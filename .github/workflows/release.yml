name: Release Helm Charts

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Create the GitHub release and push index.yaml to gh-pages.
      contents: write
    outputs:
      releases: ${{ steps.released.outputs.releases }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Configure Git user
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Run chart-releaser job
        id: cr
        uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957 # v1.9.0
        with:
          # Releases are immutable, so a rerun after a partial failure cannot
          # recreate one. Skip existing releases only on reruns, so a first
          # attempt still fails when a chart changes without a version bump.
          # cr.sh treats any non-empty value, even "false", as set.
          skip_existing: ${{ github.run_attempt != '1' && 'true' || '' }}
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: List released charts
        id: released
        env:
          CHART_VERSIONS: ${{ steps.cr.outputs.chart_version }}
        run: |
          releases=$(jq -cn --arg versions "$CHART_VERSIONS" '$versions | split(",") | map(select(length > 0))')
          echo "releases=$releases" >> "$GITHUB_OUTPUT"
          echo "Released: $releases"

  # chart-releaser's own oci_registry_url push is not used: its registry
  # client discards the pushed digest, and on a rerun it pushes a fresh
  # `helm package` whose bytes differ from the immutable release asset. This
  # job pushes the release asset itself, so the OCI chart and the GitHub
  # release are the same bytes, and reads the digest from `helm push`.
  publish-oci:
    needs: release
    if: needs.release.outputs.releases != '' && needs.release.outputs.releases != '[]'
    runs-on: ubuntu-latest
    permissions:
      # Download and verify the release asset.
      contents: read
      # Push the chart and its attestation to GHCR.
      packages: write
      # Request the short-lived Sigstore certificate that signs the attestation.
      id-token: write
      # Store the attestation in the repository.
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(needs.release.outputs.releases) }}
    env:
      OCI_REPOSITORY: ghcr.io/${{ github.repository_owner }}/charts
      RELEASE: ${{ matrix.release }}
    steps:
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # The Helm library chart-releaser v1.10.0 packages with.
          version: v3.22.1

      # Helm and actions/attest both read this Docker credential store.
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and verify the release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE" -R "$GITHUB_REPOSITORY" -p "$RELEASE.tgz" -D dist
          gh release verify-asset "$RELEASE" "dist/$RELEASE.tgz" -R "$GITHUB_REPOSITORY"

      - name: Push the chart to GHCR
        id: push
        run: |
          set -euo pipefail
          package="dist/$RELEASE.tgz"
          name=$(helm show chart "$package" | sed -n 's/^name: //p')
          version=$(helm show chart "$package" | sed -n 's/^version: //p')
          asset_digest="sha256:$(sha256sum "$package" | cut -d ' ' -f 1)"

          # A rerun reuses an earlier push only if it holds the release asset's
          # exact bytes. Pushing again would move the tag to a new manifest.
          mkdir -p existing
          if helm pull "oci://$OCI_REPOSITORY/$name" --version "$version" -d existing > pull.log 2>&1; then
            existing_digest="sha256:$(sha256sum existing/*.tgz | cut -d ' ' -f 1)"
            if [[ "$existing_digest" != "$asset_digest" ]]; then
              echo "::error::$OCI_REPOSITORY/$name:$version holds $existing_digest, not the release asset $asset_digest. Delete that package version in GHCR, then rerun."
              exit 1
            fi
            digest=$(sed -n 's/^Digest: //p' pull.log)
          elif grep -q 'not found' pull.log; then
            helm push "$package" "oci://$OCI_REPOSITORY" 2>&1 | tee push.log
            digest=$(sed -n 's/^Digest: //p' push.log)
          else
            # Any other pull failure leaves the tag's contents unknown, and
            # pushing could then replace different bytes.
            cat pull.log
            echo "::error::Could not check whether $OCI_REPOSITORY/$name:$version exists. Rerun this job."
            exit 1
          fi

          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not read the manifest digest for $OCI_REPOSITORY/$name:$version"
            exit 1
          fi
          echo "name=$OCI_REPOSITORY/$name" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published $OCI_REPOSITORY/$name:$version@$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest the OCI chart
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # A storage record needs the artifact-metadata permission and adds
          # nothing to verification.
          create-storage-record: false
