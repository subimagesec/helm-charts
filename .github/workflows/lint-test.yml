name: Lint and Test Charts

on:
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/lint-test.yml'
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - '.github/workflows/lint-test.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.list-charts.outputs.charts }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List charts
        id: list-charts
        run: |
          charts=$(find charts -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "charts=$charts" >> "$GITHUB_OUTPUT"
          echo "Found charts: $charts"

  lint:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.discover.outputs.charts) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint ${{ matrix.chart }}
        run: |
          chart="charts/${{ matrix.chart }}"

          helm lint "$chart"

          shopt -s nullglob
          for values in "$chart"/ci/*-values.yaml; do
            helm lint "$chart" -f "$values"
          done

  template:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.discover.outputs.charts) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Template ${{ matrix.chart }}
        run: |
          chart="charts/${{ matrix.chart }}"

          helm template test-release "$chart" -f "$chart/values-example.yaml" > /dev/null

          shopt -s nullglob
          for values in "$chart"/ci/*-values.yaml; do
            echo "Templating with $values"
            helm template test-release "$chart" -f "$values" > /dev/null
          done

      - name: Reject podLabels that override selector labels
        if: matrix.chart == 'subimage-outpost'
        run: |
          chart="charts/subimage-outpost"

          for label in 'app\.kubernetes\.io/name' 'app\.kubernetes\.io/instance'; do
            if helm template test-release "$chart" -f "$chart/values-example.yaml" \
                --set "podLabels.${label}=other" > /dev/null 2>&1; then
              echo "podLabels overrode selector label $label without failing the render"
              exit 1
            fi
          done

      - name: Check the rendered image reference
        if: matrix.chart == 'subimage-outpost'
        run: |
          set -o pipefail
          chart="charts/subimage-outpost"
          repository="ghcr.io/subimagesec/subimage-outpost"
          app_version=$(helm show chart "$chart" | sed -n 's/^appVersion: //p' | tr -d "\"'")

          render_image() {
            helm template test-release "$chart" -f "$chart/values-example.yaml" \
              --show-only templates/deployment.yaml "$@" | sed -n 's/^ *image: "\(.*\)"$/\1/p'
          }

          default_image=$(render_image)
          if [[ ! "$default_image" =~ ^"$repository:$app_version"@sha256:[0-9a-f]{64}$ ]]; then
            echo "Default render is not pinned to the appVersion by digest: $default_image"
            exit 1
          fi

          override_image=$(render_image --set image.tag=9.9.9)
          if [[ "$override_image" != "$repository:9.9.9" ]]; then
            echo "image.tag=9.9.9 rendered $override_image, expected $repository:9.9.9 without the default digest"
            exit 1
          fi

      # GHCR tags are mutable, so this also fails if the appVersion tag is
      # repointed after the digest was pinned.
      - name: Check image.digest matches the registry
        if: matrix.chart == 'subimage-outpost'
        run: |
          set -o pipefail
          chart="charts/subimage-outpost"

          image=$(helm template test-release "$chart" -f "$chart/values-example.yaml" \
            --show-only templates/deployment.yaml | sed -n 's/^ *image: "\(.*\)"$/\1/p')
          pinned="${image#*@}"
          registry=$(docker buildx imagetools inspect "${image%@*}" --format '{{json .Manifest}}' | jq -r .digest)

          if [[ "$pinned" != "$registry" ]]; then
            echo "image.digest is $pinned but ${image%@*} resolves to $registry. Update image.digest in $chart/values.yaml."
            exit 1
          fi
          echo "${image%@*} resolves to $pinned"
