# Default values for subimage-outpost

# Override the chart name
nameOverride: ""
# Override the full release name
fullnameOverride: ""

# Outpost configuration
outpost:
  # REQUIRED: Tenant ID (provided by SubImage)
  # Used for Tailscale hostname and ACL tags
  # Example: "acme", "customer-id"
  tenantId: ""

  # Internal: SubImage environment - DO NOT CHANGE
  # This is SubImage's deployment environment, not your environment
  # Should always be "prod" unless explicitly instructed by SubImage support
  environment: "prod"

  # OPTIONAL: Outpost name (for multiple outposts per tenant)
  # Used to differentiate multiple outposts for the same tenant
  # Default: "subimage"
  # Example: "eks", "gke", "rancher" (if you have multiple K8s clusters)
  name: "subimage"

  # REQUIRED: Target URL to proxy (e.g., https://kubernetes.default.svc)
  proxyTarget: "https://kubernetes.default.svc"

  # REQUIRED: Verify TLS certificates (set to false for self-signed certs)
  verifyTls: true

  # OPTIONAL: Path inside the pod to a CA bundle file for TLS verification.
  # Only honored when verifyTls: true.
  # If unset, the outpost auto-detects the Kubernetes serviceaccount CA at
  # /var/run/secrets/kubernetes.io/serviceaccount/ca.crt when present, which
  # is what's needed to verify https://kubernetes.default.svc.
  caBundle: ""

  # OPTIONAL: Seconds to wait for a TCP/TLS connection to proxyTarget.
  # Leave empty to use the image default (15). Raise it when cluster DNS is
  # slow: a degraded CoreDNS with ndots:5 search-domain fanout can take a
  # while to resolve kubernetes.default.svc, and the outpost used to give
  # up after httpx's 5s default.
  connectTimeout: ""

  # OPTIONAL: Seconds to wait for the target's response, also applied to the
  # write and pool timeouts. Leave empty to use the image default (60).
  # Raise it for large list calls against a big cluster.
  readTimeout: ""

  # OPTIONAL: Override Host header sent to target
  # Useful for reverse proxies that require specific Host headers
  # Leave empty to use the original Host header from the request
  proxyHost: ""

  # REQUIRED: Tailscale OAuth client secret
  # Provided by SubImage - this is NOT an ephemeral auth key
  # The OAuth client is created via Terraform and scoped to your tenant
  # NOTE: The chart automatically appends "?ephemeral=true" to ensure
  # the Tailscale node is removed when the pod is deleted
  authKey:
    # The auth key value (required when secret.create is true)
    value: ""
    secret:
      # Set to false to use a pre-existing secret instead of creating one
      create: true
      # Name of the pre-existing secret (only used when secret.create is false)
      # Ignored when secret.create is true (uses "<fullname>-secrets")
      name: ""
      # Key inside the pre-existing secret that holds the auth key
      # Only used when secret.create is false (defaults to "TAILSCALE_AUTHKEY")
      # Ignored when secret.create is true (always uses "TAILSCALE_AUTHKEY")
      key: "TAILSCALE_AUTHKEY"

# Image configuration
image:
  repository: ghcr.io/subimagesec/subimage-outpost
  # image.tag: leave empty to run the chart's appVersion, pinned to
  # image.digest. A tag you set runs as-is and image.digest is ignored, because
  # the default digest belongs to the appVersion image. To pin your own tag by
  # digest, put the digest in the tag: "1.2.6@sha256:<digest>".
  tag: ""
  # image.digest: index digest of <repository>:<appVersion>. CI fails when it
  # differs from the registry. Set it to "" to pull the appVersion by tag only,
  # for example from a mirror that does not preserve the multi-arch index.
  digest: "sha256:872f84f2eff37c8b567c114cc95df79dc7657f779179b60b4820b9c975bbb7d9"
  pullPolicy: IfNotPresent

# Image pull secrets (not required - image is public)
imagePullSecrets: []

# Namespace configuration
namespace:
  # Create namespace or use existing
  create: true
  name: "subimage-outpost"

  # Pod Security Standards labels for the namespace (only applied when
  # namespace.create is true). Options: privileged, baseline, restricted.
  # The outpost pod meets "restricted" with the default securityContext and
  # podSecurityContext. enforce stays "baseline" so a sidecar or volume that
  # another admission webhook injects does not block an upgrade; audit and
  # warn report any restricted violation so you can raise enforce safely.
  podSecurity:
    enforce: "baseline"
    audit: "restricted"
    warn: "restricted"

  # Labels for service mesh exemption
  labels:
    # Disable Istio sidecar injection
    istio-injection: disabled
    # Disable Linkerd injection
    linkerd.io/inject: disabled
    # Mark as infrastructure namespace
    subimage.io/outpost: "true"

# Resource limits and requests
resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# Pod terminationGracePeriodSeconds. Must cover the preStop hook (tailscale
# logout) plus the regular SIGTERM grace — preStop runs first and the grace
# clock starts when termination is requested.
terminationGracePeriodSeconds: 60

# Network Policy configuration
networkPolicy:
  # Enable NetworkPolicy to allow Tailscale egress
  enabled: true

  # networkPolicy.egressRules: the default egress allow list. Replace the
  # whole list to run a stricter policy (see "Network-Restricted Clusters" in
  # README.md). Port 443 stays open to any address because Tailscale's control
  # plane, logging and DERP relays all serve on 443 from addresses Tailscale
  # changes over time, and outpost.proxyTarget can be any HTTPS endpoint.
  egressRules:
    # Tailscale control plane, DERP relays and the Kubernetes API (HTTPS).
    # 6443 is here because the kubernetes.default.svc endpoints are node IPs
    # on self-managed clusters (kubeadm, RKE), which no pod selector matches.
    - to:
      - ipBlock:
          cidr: 0.0.0.0/0
      - ipBlock:
          cidr: ::/0
      ports:
      - protocol: TCP
        port: 443
      - protocol: TCP
        port: 6443
    # STUN (3478) and direct WireGuard (41641). Without them Tailscale still
    # connects, but relays every packet through DERP over TCP 443.
    - to:
      - ipBlock:
          cidr: 0.0.0.0/0
      - ipBlock:
          cidr: ::/0
      ports:
      - protocol: UDP
        port: 3478
      - protocol: UDP
        port: 41641
    # DNS. TCP 53 is required because glibc retries over TCP when a UDP
    # response comes back truncated; dropping it makes the resolver stall
    # instead of failing fast.
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
      ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53

  # networkPolicy.extraEgressRules: rules appended after egressRules, so you
  # can allow one more destination without copying the defaults. For example,
  # when outpost.proxyTarget is a Service whose pods listen on 8443:
  # - to:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: internal-api
  #   ports:
  #   - protocol: TCP
  #     port: 8443
  extraEgressRules: []

# Proxy configuration for corporate environments
proxy:
  enabled: false
  httpProxy: ""
  httpsProxy: ""
  allProxy: ""
  noProxy: "localhost,127.0.0.1,.svc,.cluster.local"

# Extra environment variables for the outpost container, in Kubernetes
# EnvVar format. They render after the chart's own variables.
extraEnv: []
# - name: BEARER_TOKEN_PATH
#   value: /etc/outpost/token/token

# Extra pod volumes, in Kubernetes Volume format.
extraVolumes: []
# - name: target-ca
#   configMap:
#     name: target-ca

# Extra volume mounts for the outpost container, in Kubernetes VolumeMount
# format. Pair with extraVolumes, for example to mount the file that
# outpost.caBundle points at.
extraVolumeMounts: []
# - name: target-ca
#   mountPath: /etc/outpost/ca
#   readOnly: true

# Pod annotations
podAnnotations: {}
  # Uncomment only if AppArmor interferes (violates baseline PSS on EKS)
  # container.apparmor.security.beta.kubernetes.io/outpost: "unconfined"

# podLabels: extra labels for the outpost pod. Admission webhooks often key on
# pod labels, so this is how you opt the pod out of an injection that the
# namespace's Pod Security level would reject. The selector labels
# app.kubernetes.io/name and app.kubernetes.io/instance are reserved; setting
# either fails the render. Values are rendered as strings.
podLabels: {}
  # Stop Datadog's admission controller from injecting a hostPath volume,
  # which the baseline and restricted Pod Security levels reject.
  # admission.datadoghq.com/enabled: "false"

# Node selection
nodeSelector: {}

# Tolerations for tainted nodes
tolerations: []
# Example: Allow scheduling on nodes with specific taints
# - key: "dedicated"
#   operator: "Equal"
#   value: "outpost"
#   effect: "NoSchedule"

# Affinity rules
affinity: {}

# Liveness probe configuration
livenessProbe:
  enabled: true
  exec:
    command: ["test", "-S", "/var/run/tailscale/tailscaled.sock"]
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Readiness probe configuration
readinessProbe:
  enabled: true
  exec:
    command: ["test", "-S", "/var/run/tailscale/tailscaled.sock"]
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Service account
serviceAccount:
  # Create service account for the outpost
  create: true
  # Name of the service account (defaults to release fullname if empty)
  name: ""
  # Annotations to add to the service account
  annotations: {}

# RBAC configuration for Kubernetes API access
rbac:
  # Create ClusterRole and ClusterRoleBinding
  create: true
  # Grant list permission on Secrets cluster-wide.
  # Note: `list` returns full Secret data (values), not just metadata.
  # Set to false to opt out if the outpost does not need Secret contents.
  secrets: true
  # Which ConfigMaps the outpost can read (get only, never list).
  #   all:     every ConfigMap in the cluster. Recommended: new SubImage
  #            coverage that reads a ConfigMap works without a chart change.
  #   awsAuth: only kube-system/aws-auth, through a Role in kube-system.
  #            SubImage reads it to map IAM principals to Kubernetes users
  #            and groups on EKS.
  #   none:    no ConfigMap access. For clusters that are not EKS.
  configMaps: all

# podSecurityContext: pod-level security context. The defaults, with
# securityContext below, satisfy the "restricted" Pod Security Standard. The
# image runs as UID 10001, so runAsNonRoot holds without pinning a UID, which
# would conflict with platforms that assign one (OpenShift).
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# securityContext: container-level security context. Tailscale runs in
# userspace networking mode, so the outpost needs no Linux capabilities.
# readOnlyRootFilesystem stays unset because tailscaled and the log tee write
# to the image filesystem (/var/run/tailscale, /tmp).
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
