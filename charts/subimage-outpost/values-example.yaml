# Example values for SubImage Outpost
# Copy this file and customize for your environment

# REQUIRED: Basic outpost configuration
outpost:
  # REQUIRED: Tenant ID (provided by SubImage)
  # Used for Tailscale hostname and ACL tags
  # Example: "acme", "customer-id"
  tenantId: "acme"

  # OPTIONAL: Outpost name (for multiple outposts per tenant)
  # Default: "subimage"
  # Example: "eks", "gke", "rancher" (if you have multiple K8s clusters)
  name: "eks-test"

  # REQUIRED: Target URL to proxy (typically the Kubernetes API)
  proxyTarget: "https://kubernetes.default.svc"

  # REQUIRED: Verify TLS certificates
  # The chart uses the mounted Kubernetes service account CA by default.
  verifyTls: true

  # OPTIONAL: Override Host header sent to target
  # Leave empty unless your reverse proxy requires a specific Host header
  # proxyHost: "api.internal.company.com"

  # OPTIONAL: Proxy timeouts in seconds. Leave unset to use the image defaults
  # (15 connect, 60 read). Raise connectTimeout on clusters with slow DNS, and
  # readTimeout for large list calls against a big cluster.
  # connectTimeout: "30"
  # readTimeout: "120"

  # REQUIRED: Tailscale OAuth client secret (provided by SubImage)
  # NOTE: Do not add "?ephemeral=true" - the chart does this automatically
  authKey:
    value: "tskey-client-xxxxx-xxxxxxxxxxxxxx"
    secret:
      create: true
      # When create is true, name and key are ignored:
      #   - Secret name is always "<fullname>-secrets"
      #   - Secret key is always "TAILSCALE_AUTHKEY"
  # To use a pre-existing secret instead:
  # authKey:
  #   secret:
  #     create: false
  #     name: "my-existing-secret"
  #     key: "TAILSCALE_AUTHKEY"

# Image configuration
# Uses the official SubImage Outpost image from GitHub Container Registry.
# The tag is intentionally not pinned here so the example follows the chart
# default in values.yaml. Pinning it in both places let this file drift two
# releases behind. Uncomment to pin a specific version.
image:
  repository: ghcr.io/subimagesec/subimage-outpost
  # tag: "1.2.1"
  pullPolicy: IfNotPresent

# OPTIONAL: Corporate proxy configuration
# Uncomment and configure if behind a corporate proxy
# proxy:
#   enabled: true
#   httpProxy: "http://proxy.company.com:8080"
#   httpsProxy: "http://proxy.company.com:8080"
#   allProxy: "http://proxy.company.com:8080"
#   noProxy: "localhost,127.0.0.1,.svc,.cluster.local"

# OPTIONAL: Node placement
# Uncomment to schedule on specific nodes
# nodeSelector:
#   node.kubernetes.io/purpose: outpost
#   kubernetes.io/arch: amd64

# OPTIONAL: Tolerations for tainted nodes
# Uncomment to allow scheduling on tainted nodes
# tolerations:
#   - key: "dedicated"
#     operator: "Equal"
#     value: "outpost"
#     effect: "NoSchedule"

# OPTIONAL: Pod Security Standards
# Change if your cluster requires different PSS levels
namespace:
  create: true
  name: "subimage-outpost"
  podSecurity:
    enforce: "baseline"  # Options: privileged, baseline, restricted
    audit: "baseline"
    warn: "baseline"

# OPTIONAL: Resource limits
# Adjust based on your cluster capacity
resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# OPTIONAL: NetworkPolicy
# Disable if your CNI doesn't support NetworkPolicy
networkPolicy:
  enabled: true
  # The defaults allow TCP 443 and 6443 to any destination for portable
  # Tailscale and Kubernetes API connectivity. See README.md before replacing
  # egressRules in a destination-restricted environment.

# OPTIONAL: RBAC for Kubernetes API access
# Required if proxyTarget is the Kubernetes API
rbac:
  create: true
  # Enable only if Secret discovery is required; `list` returns Secret values.
  secrets: false
